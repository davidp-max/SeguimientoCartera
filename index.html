<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cartera de Inversiones</title>
  <!-- Tailwind CSS para el diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para los gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse para leer los datos de Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Encabezado -->
  <header class="border-b border-slate-800 bg-slate-950 p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-emerald-400">📊 Cartera de Inversión</h1>
      <button onclick="loadPortfolioData()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg font-medium transition">
        🔄 Actualizar Datos
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Indicador de Carga -->
    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
      <p class="mt-2 text-slate-400 text-sm">Cargando datos desde Google Sheets...</p>
    </div>

    <!-- Contenido Principal (Oculto mientras carga) -->
    <div id="content" class="hidden space-y-6">

      <!-- Fila de Tarjetas KPI (Dashboard) -->
      <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
          <p class="text-xs text-slate-400 font-medium uppercase">Total Invertido</p>
          <p id="kpi-invested" class="text-2xl font-bold text-white mt-1">-- €</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
          <p class="text-xs text-slate-400 font-medium uppercase">Ganancias / Pérdidas</p>
          <p id="kpi-profit" class="text-2xl font-bold mt-1">-- €</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
          <p class="text-xs text-slate-400 font-medium uppercase">Total Dividendos</p>
          <p id="kpi-dividends" class="text-2xl font-bold text-emerald-400 mt-1">-- €</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
          <p class="text-xs text-slate-400 font-medium uppercase">Rentabilidad Total</p>
          <p id="kpi-return" class="text-2xl font-bold mt-1">-- %</p>
        </div>
      </section>

      <!-- Tabla de Posiciones Activas (Cartera) -->
      <section class="bg-slate-800/60 border border-slate-700/50 rounded-xl overflow-hidden">
        <div class="p-4 border-b border-slate-700/50 flex justify-between items-center">
          <h2 class="font-bold text-slate-200">Posiciones de la Cartera</h2>
          <span id="position-count" class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded-full">0 Posiciones</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase border-b border-slate-700/50">
              <tr>
                <th class="p-3">Ticker</th>
                <th class="p-3">Nombre</th>
                <th class="p-3">Sector</th>
                <th class="p-3">Acciones</th>
                <th class="p-3">Divisa</th>
                <th class="p-3 text-right">Invertido (€)</th>
                <th class="p-3 text-right">Rentabilidad</th>
              </tr>
            </thead>
            <tbody id="portfolio-table-body" class="divide-y divide-slate-700/30">
              <!-- Carga dinámica -->
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script>
    // ID extraído de la URL de tu Google Sheet
    const SPREADSHEET_ID = '1PJ9o7U5PZGt9NDAohI_CNbBAK_6PaxbAIxj8UMpd9hA';

    // Función genérica para descargar pestañas en formato CSV
    async function fetchSheetData(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
      const response = await fetch(url);
      const csvText = await response.text();
      return new Promise((resolve) => {
        Papa.parse(csvText, {
          header: false,
          skipEmptyLines: true,
          complete: (results) => resolve(results.data)
        });
      });
    }

    async function loadPortfolioData() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');

      try {
        // Cargar datos de la pestaña Dashboard y Cartera
        const dashboardRows = await fetchSheetData('Dashboard');
        const carteraRows = await fetchSheetData('Cartera');

        // Parsear Métricas del Dashboard (Fila 2)
        if (dashboardRows.length > 1) {
          const row = dashboardRows[1];
          document.getElementById('kpi-invested').innerText = (row[4] || '0') + ' EUR';
          
          const profitElem = document.getElementById('kpi-profit');
          profitElem.innerText = (row[5] || '0') + ' EUR';
          profitElem.className = `text-2xl font-bold mt-1 ${row[5] && row[5].includes('-') ? 'text-red-400' : 'text-emerald-400'}`;

          document.getElementById('kpi-dividends').innerText = (row[7] || '0') + ' EUR';

          const returnElem = document.getElementById('kpi-return');
          returnElem.innerText = (row[14] || '0');
          returnElem.className = `text-2xl font-bold mt-1 ${row[14] && row[14].includes('-') ? 'text-red-400' : 'text-emerald-400'}`;
        }

        // Renderizar Tabla de Posiciones desde 'Cartera'
        const tbody = document.getElementById('portfolio-table-body');
        tbody.innerHTML = '';

        // Ignorar encabezados principales y filtrar filas con datos de Tickers
        const positions = carteraRows.slice(2).filter(r => r[1] && r[1].trim() !== '' && r[1] !== 'Ticker');
        document.getElementById('position-count').innerText = `${positions.length} Posiciones`;

        positions.forEach(r => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-800/40 transition';
          
          const returnVal = r[19] || '0%';
          const isNegative = returnVal.includes('-');

          tr.innerHTML = `
            <td class="p-3 font-semibold text-emerald-400">${r[1] || ''}</td>
            <td class="p-3 text-slate-200">${r[2] || ''}</td>
            <td class="p-3 text-slate-400">${r[3] || ''}</td>
            <td class="p-3">${r[6] || '0'}</td>
            <td class="p-3"><span class="bg-slate-700 text-xs px-2 py-0.5 rounded">${r[7] || 'EUR'}</span></td>
            <td class="p-3 text-right font-mono">${r[13] || '0'} €</td>
            <td class="p-3 text-right font-semibold ${isNegative ? 'text-red-400' : 'text-emerald-400'}">${returnVal}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

      } catch (error) {
        console.error('Error al cargar datos:', error);
        alert('Ocurrió un error al cargar la información desde Google Sheets.');
      }
    }

    // Inicializar carga al abrir la página
    document.addEventListener('DOMContentLoaded', loadPortfolioData);
  </script>
</body>
</html>
